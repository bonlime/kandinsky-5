[project]
name = "kandinsky-5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "ipykernel",
    "ipywidgets",
    "pillow",
    "torch >= 2.8.0",
    "packaging",
    "requests",
    "anyio",
    "pydantic",
    "aiohttp",
    "websocket-client",
    "beautifulsoup4",
    "torchvision",
    "transformers >= 4.56.1",
    "diffusers",
    "accelerate",
    "einops",
    "imageio",
    "imageio-ffmpeg",
    "opencv-python",
    "pytest",
    "sentencepiece",
    "tqdm",
    "av",
    "omegaconf",
    "ninja",
    "numpy",
    "bitsandbytes",
    "peft",
]


[[tool.uv.index]]
name = "pytorch-cu130-nightly"
url = "https://download.pytorch.org/whl/nightly/cu130"
# explicit = true # with this options it fails to resolve

[tool.uv.sources]
torch = [{ index = "pytorch-cu130-nightly"}]
torchvision = [{ index = "pytorch-cu130-nightly"}]
# pytorch-triton = [{ index = "pytorch-cu130-nightly"}]
# triton = [{ index = "pytorch-cu130-nightly"}]

[tool.uv]
prerelease = "allow"
